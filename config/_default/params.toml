# ==============================================================================
# 站点参数
# ------------------------------------------------------------------------------
# 注意：本文件会「整体覆盖」主题自带的 themes/new/config/_default/params.toml，
#       而不是逐项合并。所以下面保留的都是主题功能实际依赖的键，
#       随意删除（如 dateFormat、colorScheme、imageProcessing）会导致
#       日期格式、明暗切换、图片处理等功能异常。
#
# 本站目前只有主页，文章相关的配置暂时用不到但保留着，
# 以后开始写文章时直接生效。
# ==============================================================================

# 首页要列出哪些栏目的文章。发文章后设为 ["post"]（文章放在 content/post/ 下）。
# 留空 = 首页不列出任何文章。
mainSections   = []

rssFullContent = true
favicon        = "img/avatar1.jpg"

# 文章排序："default" 或 "lastmod"
SortBy         = "default"

[footer]
    since      = 2019
    customText = ""

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

# 左侧栏（头像 / 站名 / 副标题）。
# 站名取自 hugo.toml 的 title，副标题在 languages.toml 里配置。
[sidebar]
    compact = false
    emoji   = "😭"
    enabled = true
    avatar  = "img/avatar.png"

[article]
    headingAnchor = false
    math          = true
    toc           = true
    readingTime   = true

    [article.list]
        showTags = false

    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

    [article.mermaid]
        look                  = "classic"
        lightTheme            = "default"
        darkTheme             = "dark"
        securityLevel         = "strict"
        htmlLabels            = true
        transparentBackground = false

    [article.alertIcon]
        note      = "📝"
        tip       = "💡"
        important = "📌"
        warning   = "⚠️"
        caution   = "🚨"

# ------------------------------------------------------------------------------
# 右侧栏小工具：已全部移除（右栏不再显示）。
# 若想恢复右栏，在 layouts/home.html 里取消 right-sidebar 部分的注释，
# 并在下面按需配置，例如：
#     homepage = [{ type = "search" }, { type = "archives" }]
#     page     = [{ type = "toc" }]
# ------------------------------------------------------------------------------
[widgets]
    homepage = []
    page     = []

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

[imageProcessing]
    autoOrient = false

    [imageProcessing.external]
        timeout = "5s"

    [imageProcessing.content]
        widths  = [800, 1600, 2400]
        enabled = true

    [imageProcessing.thumbnail]
        enabled = true

# ------------------------------------------------------------------------------
# 评论：暂无文章，故关闭。
# 需要时把 enabled 改为 true 并填好对应 provider 的参数
# （disqus 需要 shortname；也可用 utterances / giscus / waline / twikoo）。
# ------------------------------------------------------------------------------
[comments]
    enabled  = false
    provider = "disqus"

    [comments.disqusjs]
        shortname = ""

    [comments.utterances]
        repo      = ""
        issueTerm = "pathname"
        label     = ""

    [comments.giscus]
        repo       = ""
        repoID     = ""
        category   = ""
        categoryID = ""
        mapping    = "title"
        lang       = "zh-CN"

    [comments.waline]
        serverURL    = ""
        lang         = "zh-CN"
        requiredMeta = ["name", "email", "url"]

    [comments.twikoo]
        envId  = ""
        region = ""
        lang   = "zh-CN"

# ------------------------------------------------------------------------------
# 自定义参数示例：在模板里用 {{ .Site.Params.mysite.xxx }} 取用。
# 可以直接按自己的需要增删。
# ------------------------------------------------------------------------------
[mysite]
    # 例如：description = "这里是站点简介"
    description = ""
