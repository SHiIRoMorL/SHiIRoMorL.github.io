# ==============================================================================
# 站点参数
# ------------------------------------------------------------------------------
# 主页与栏目使用 layouts/ 下的个人资料库模板。
# 以下同时保留主题 RSS 等功能所需的参数。
# ==============================================================================

# RSS 收录随手记和游戏记录；首页始终只显示主视觉与四个入口。
mainSections   = ["notes", "games"]

rssFullContent = true
favicon        = "img/avatar1.jpg"

# 文章排序："default" 或 "lastmod"
SortBy         = "default"

[footer]
    since      = 2019
    customText = ""

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

# 左侧栏（头像 / 站名 / 副标题）。
# 站名取自 hugo.toml 的 title，副标题在 languages.toml 里配置。
[sidebar]
    compact = false
    emoji   = "😭"
    enabled = true
    avatar  = "img/avatar.png"

[article]
    headingAnchor = false
    math          = true
    toc           = true
    readingTime   = true

    [article.list]
        showTags = false

    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

    [article.mermaid]
        look                  = "classic"
        lightTheme            = "default"
        darkTheme             = "dark"
        securityLevel         = "strict"
        htmlLabels            = true
        transparentBackground = false

    [article.alertIcon]
        note      = "📝"
        tip       = "💡"
        important = "📌"
        warning   = "⚠️"
        caution   = "🚨"

# ------------------------------------------------------------------------------
# 个人资料库布局不使用主题的右侧栏小工具。
# ------------------------------------------------------------------------------
[widgets]
    homepage = []
    page     = []

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "light"

[imageProcessing]
    autoOrient = false

    [imageProcessing.external]
        timeout = "5s"

    [imageProcessing.content]
        widths  = [800, 1600, 2400]
        enabled = true

    [imageProcessing.thumbnail]
        enabled = true

# ------------------------------------------------------------------------------
# 评论：暂无文章，故关闭。
# 需要时把 enabled 改为 true 并填好对应 provider 的参数
# （disqus 需要 shortname；也可用 utterances / giscus / waline / twikoo）。
# ------------------------------------------------------------------------------
[comments]
    enabled  = false
    provider = "disqus"

    [comments.disqusjs]
        shortname = ""

    [comments.utterances]
        repo      = ""
        issueTerm = "pathname"
        label     = ""

    [comments.giscus]
        repo       = ""
        repoID     = ""
        category   = ""
        categoryID = ""
        mapping    = "title"
        lang       = "zh-CN"

    [comments.waline]
        serverURL    = ""
        lang         = "zh-CN"
        requiredMeta = ["name", "email", "url"]

    [comments.twikoo]
        envId  = ""
        region = ""
        lang   = "zh-CN"

# ------------------------------------------------------------------------------
# 自定义参数示例：在模板里用 {{ .Site.Params.mysite.xxx }} 取用。
# 可以直接按自己的需要增删。
# ------------------------------------------------------------------------------
[mysite]
    owner = "ShIRoMorl"
    description = "一些文件，一些故事。把喜欢的、用得上的，都留在这里。"
