# ==============================================================================
# 语言与本站文案
# ------------------------------------------------------------------------------
# 本站只保留简体中文。侧边栏副标题、社交链接都集中放这里，方便一处改完。
# ==============================================================================

[zh]
    languageName = "简体中文"
    title        = "ShIRoMorl's Library"
    weight       = 1

    [zh.params.sidebar]
        # 显示在侧边栏站名下方的副标题
        subtitle = "你好，这是赛博社恐的个人站喵"

    # --------------------------------------------------------------------------
    # 侧边栏社交图标。不需要的整段删掉即可；想加就照格式再写一段。
    # 可选图标见 assets/icons/ 目录（如 brand-github、brand-twitter、rss、user）。
    # --------------------------------------------------------------------------
    [[zh.menus.social]]
        identifier = "github"
        name       = "GitHub"
        url        = "https://github.com/SHiIRoMorL"

        [zh.menus.social.params]
            icon = "brand-github"
